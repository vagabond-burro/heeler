[package]
name = "heeler-raw"
version.workspace = true
edition.workspace = true
# LibRaw is consumed under its CDDL-1.0 dual-license option; the license
# text ships beside the source it covers, in the vendored tree under
# third_party/. No GPL-family code. The version lives in build.rs as
# LIBRAW_VERSION and nowhere else: this note used to name 0.21.3 for a
# month after the build moved to 0.22.2. GoPro's VC-5 decoder
# (third_party/gpr-vc5, for GPR files) is taken under its MIT option.
license = "MPL-2.0 AND CDDL-1.0 AND MIT"

[dependencies]
heeler-engine = { path = "../heeler-engine" }
# The pure Rust develop (crates/heeler-rawdec), taken for the files it
# has been verified on when the rust-decoder feature is on; its DNG
# opcode code (gain_map) serves LibRaw's develop either way.
heeler-rawdec = { path = "../heeler-rawdec" }
libz-sys = { version = "1.1.29", default-features = false, features = ["static"] }
mozjpeg-sys = "2.2.3"
# The linear DNG decoder's tiles side by side (src/linear_dng.rs); the
# workspace links it through heeler-engine already.
rayon = "1"
thiserror.workspace = true

[features]
# Off by default: the shipped app develops every raw with LibRaw until the
# owner turns this on.
rust-decoder = []

[dev-dependencies]
# examples/colorcheck.rs reads spectral data files.
serde_json.workspace = true

[build-dependencies]
cc = "1"
