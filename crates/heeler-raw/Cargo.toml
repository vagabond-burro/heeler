[package]
name = "heeler-raw"
version.workspace = true
edition.workspace = true
# LibRaw (the libraw feature, never in the shipped app) is consumed under
# its CDDL-1.0 dual-license option; the license text sits beside the
# source it covers, in the vendored tree under third_party/. No
# GPL-family code. The version lives in build.rs as
# LIBRAW_VERSION and nowhere else: this note used to name 0.21.3 for a
# month after the build moved to 0.22.2.
license = "MPL-2.0 AND CDDL-1.0"

[dependencies]
heeler-engine = { path = "../heeler-engine" }
# The pure Rust develop (crates/heeler-rawdec), taken for the files it
# has been verified on when the rust-decoder feature is on; its DNG
# opcode code (gain_map) serves LibRaw's develop either way.
heeler-rawdec = { path = "../heeler-rawdec" }
# LibRaw's deflate and lossy DNG decoders (the libraw feature only).
libz-sys = { version = "1.1.29", default-features = false, features = ["static"], optional = true }
mozjpeg-sys = { version = "2.2.3", optional = true }
# The linear DNG decoder's tiles side by side (src/linear_dng.rs); the
# workspace links it through heeler-engine already.
rayon = "1"
thiserror.workspace = true

[features]
# LibRaw, compiled from the vendored tree: on by default for the tests and
# harnesses that hold the Rust develop to it. The shipped app builds
# without it (heeler-io takes this crate with default features off), so
# every file goes to heeler-rawdec and a file it declines is not opened.
default = ["libraw"]
libraw = ["dep:libz-sys", "dep:mozjpeg-sys"]
# The pure Rust develop: in front of LibRaw for the files verified against
# it when both are on, alone when LibRaw is off.
rust-decoder = []

[dev-dependencies]
# examples/colorcheck.rs reads spectral data files.
serde_json.workspace = true

[build-dependencies]
cc = "1"
