[package]
name = "heeler-rawdec"
version.workspace = true
edition.workspace = true
# Pure Rust: no C or C++, so it builds wherever the workspace's Rust
# does (iOS included). Written from the DNG and JPEG specifications.
license.workspace = true

[dependencies]
heeler-engine = { path = "../heeler-engine" }
# Deflate-compressed DNG pieces (src/deflate.rs).
miniz_oxide = "0.8"
rayon = "1"
thiserror.workspace = true

[features]
# Two roundings for every multiply-add, as the x86-64 and MSVC builds of
# LibRaw compute them, on any machine: for checking those platforms'
# develop on an aarch64 one (see fmadd).
unfused = []
