name: Publish website download manifest

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Copy the published manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir . --clobber
          python3 -m json.tool latest.json > /dev/null
          git add latest.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Keep the website download manifest current for $TAG"
            git push origin HEAD:main
          fi
